<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f6;
    --ink: #16202e;
    --muted: #55617a;
    --line: #d3d9e3;
    --accent: #2f5da8;
    --on-accent: #ffffff;
    --neutral-role: #8a94a6;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a26;
      --ink: #e8ecf3;
      --muted: #9aa5b8;
      --line: #2b3547;
      --accent: #8fb0ec;
      --on-accent: #10182a;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.55;
  }

  .wrap { max-width: 60rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }

  header { margin-bottom: 3.5rem; }
  h1 {
    margin: 0 0 1rem;
    font-size: clamp(2.6rem, 10vw, 6rem);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.03em;
    overflow-wrap: anywhere;
  }
  .tagline { margin: 0 0 1.5rem; max-width: 36rem; font-size: 1.15rem; color: var(--muted); }
  .join {
    display: inline-block;
    padding: 0.65rem 1.15rem;
    border-radius: 0.4rem;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
    text-decoration: none;
  }
  .join:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .grid { display: grid; gap: 3rem; grid-template-columns: 1fr; }
  @media (min-width: 48rem) {
    .grid { grid-template-columns: minmax(0, 1fr) 15rem; }
  }

  h2 { margin: 0 0 1rem; font-size: 1.1rem; font-weight: 600; }

  .notice { padding: 1.25rem 0; border-top: 1px solid var(--line); }
  .notice time { display: block; margin-bottom: 0.35rem; font-size: 0.9rem; color: var(--muted); }
  .notice p { margin: 0; max-width: 40rem; white-space: pre-wrap; overflow-wrap: anywhere; }

  .roles { list-style: none; margin: 0; padding: 0; }
  .roles li {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    padding: 0.55rem 0;
    border-top: 1px solid var(--line);
    overflow-wrap: anywhere;
  }
  .swatch { flex: none; width: 0.8rem; height: 0.8rem; border-radius: 50%; }

  .empty, .status { color: var(--muted); }
  footer { margin-top: 4rem; font-size: 0.9rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="name">Faction</h1>
    <p class="tagline" id="tagline" hidden></p>
    <a class="join" id="join" hidden>Join our Discord</a>
  </header>

  <p class="status" id="status" role="status"></p>

  <main class="grid">
    <section aria-labelledby="ann-h">
      <h2 id="ann-h">Announcements</h2>
      <div id="announcements"></div>
    </section>
    <section aria-labelledby="roles-h">
      <h2 id="roles-h">Roles</h2>
      <ul class="roles" id="roles"></ul>
    </section>
  </main>

  <footer id="updated"></footer>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const HEX = /^#[0-9a-f]{6}$/i;

  // Only allow real Discord invite links
  function safeInvite(value) {
    try {
      const u = new URL(value);
      if (u.protocol === 'https:' && (u.hostname === 'discord.gg' || u.hostname === 'discord.com')) {
        return u.href;
      }
    } catch (e) {}
    return null;
  }

  function fmtDate(iso, withTime) {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString(undefined, withTime
      ? { year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' }
      : { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function empty(text) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = text;
    return p;
  }

  function render(data) {
    const faction = data.faction || {};
    const name = faction.name || 'Faction';
    document.title = name;
    $('name').textContent = name;

    if (faction.tagline) {
      $('tagline').textContent = faction.tagline;
      $('tagline').hidden = false;
    }
    const invite = faction.invite && safeInvite(faction.invite);
    if (invite) {
      $('join').href = invite;
      $('join').hidden = false;
    }

    // Announcements (text is always inserted as plain text)
    const list = $('announcements');
    list.replaceChildren();
    const notices = Array.isArray(data.announcements) ? data.announcements : [];
    if (!notices.length) {
      list.append(empty('No announcements yet. Post one in Discord with /announce.'));
    }
    for (const n of notices) {
      const item = document.createElement('article');
      item.className = 'notice';
      const time = document.createElement('time');
      time.dateTime = n.date || '';
      time.textContent = fmtDate(n.date, false);
      const p = document.createElement('p');
      p.textContent = n.text || '';
      item.append(time, p);
      list.append(item);
    }

    // Roles
    const roles = $('roles');
    roles.replaceChildren();
    const roleList = Array.isArray(data.roles) ? data.roles : [];
    if (!roleList.length) {
      const li = document.createElement('li');
      li.append(empty('No roles listed yet.'));
      roles.append(li);
    }
    for (const r of roleList) {
      const li = document.createElement('li');
      const dot = document.createElement('span');
      dot.className = 'swatch';
      const usable = HEX.test(r.color || '') && r.color !== '#000000';
      dot.style.background = usable ? r.color : 'var(--neutral-role)';
      dot.setAttribute('aria-hidden', 'true');
      const label = document.createElement('span');
      label.textContent = r.name || '';
      li.append(dot, label);
      roles.append(li);
    }

    $('updated').textContent = data.updated ? 'Last updated ' + fmtDate(data.updated, true) : '';
    $('status').textContent = '';
  }

  async function load() {
    try {
      const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      render(await res.json());
    } catch (e) {
      $('status').textContent = 'Could not load the latest faction info. Refresh the page in a minute.';
    }
  }

  load();
</script>
</body>
</html>
